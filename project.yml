name: PARADOX
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9L6N2ZF26B"

targets:
  PARADOX:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        type: group
    resources:
      - path: App/Assets.xcassets
      - path: App/Preview Content
    settings:
      base:
        INFOPLIST_FILE: App/SupportingFiles/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.PARADOX
        CODE_SIGN_ENTITLEMENTS: App/SupportingFiles/PARADOX.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PARADOX
    entitlements:
      path: App/SupportingFiles/PARADOX.entitlements
    dependencies:
      - target: PARADOXWidgetExtension
        embed: true

  PARADOXWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        type: group
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.PARADOX.widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PARADOXWidget
    entitlements:
      path: Widget/Widget.entitlements

  ScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: PARADOX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.PARADOX.screenshot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TEST_TARGET_NAME: PARADOX

schemes:
  PARADOX:
    build:
      targets:
        PARADOX: all
        PARADOXWidgetExtension: all
        ScreenshotTests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenshotTests
    archive:
      config: Release